<ion-header [translucent]="true">
  <ion-toolbar>
      <div slot="start">
        <ion-title routerLink="/home">
          <div class="title"><img class="icon-img-title" src="../../assets/img/Coin.png"><div>{{ title }}</div></div>
        </ion-title>
      </div>
      <div slot="start">
        <ion-buttons>
          <ion-button routerLink="/catalog" routerLinkActive="active">
            Catálogo
          </ion-button>
          <ion-button routerLink="/history" routerLinkActive="active">
            Compras
          </ion-button>
          <ion-button routerLink="/bidding" routerLinkActive="active">
            Leilões
          </ion-button>
          <ion-button routerLink="/grade" routerLinkActive="active">
            Avaliação
          </ion-button>
          <ion-button routerLink="/sell" routerLinkActive="active">
            Vender
          </ion-button>
          <ion-button routerLink="/comunity" routerLinkActive="active">
            Comunidade
          </ion-button>
        </ion-buttons>
      </div>
      <div slot="end">
        
        <ion-button class="login-btn" color="dark" routerLink="/account">
          Entrar
        </ion-button>
        <ion-button class="register-btn" routerLink="/register">
          Criar conta
        </ion-button>
      </div>
  </ion-toolbar>
</ion-header>
