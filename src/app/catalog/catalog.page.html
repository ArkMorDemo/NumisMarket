<app-header [title]="'NumisMarket'"></app-header>

<ion-content [fullscreen]="true">
  <div id="container-1">
    <div id="Box-1">
      <h2 style="width: 100%;">Catálogo de moedas</h2>
      <div class="button-container">
        <ion-button class="bt-a"><img class="img-svg" src="../../assets/icon/notifications_24dp_03A125_FILL0_wght400_GRAD0_opsz24.svg"></ion-button>
        <ion-button class="bt-b" fill="outline">
          <img src="../../assets/icon/add_alert_24dp_03A125_FILL0_wght400_GRAD0_opsz24.svg">
          <span style="white-space: nowrap;" (click)="abrirAlerta()">Criar alerta</span>
        </ion-button>
      </div>
    </div>
    <div id="Box-2">
      <div class="a">
        <ion-item>
          <ion-label>Pais de origem</ion-label>
          <ion-select [(ngModel)]="selectedPO" (ionChange)="onPOChange($event)">
            <ion-select-option *ngFor="let coin of coins" [value]="coin.id">
              {{ coin.name }}
            </ion-select-option>
          </ion-select>
        </ion-item>
        <div *ngIf="selectedPO" style="margin-top: 20px; padding: 10px; border-radius: 8px;">
          <p>{{ selectedPO }}</p>
        </div>
        <div>Tipo</div>
        <div>Época  </div>
      </div>
      <div class="b"></div>
    </div>
  </div>
  <app-footer/>
</ion-content>
